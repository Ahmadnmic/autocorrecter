name: Android keyboard APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: android }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Android SDK (preinstalled on the runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - name: Build signed release APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.${{ github.run_number }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk inline-autocorrect.apk
      - uses: actions/upload-artifact@v4
        with: { name: inline-autocorrect-apk, path: android/inline-autocorrect.apk }
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v0.1.${{ github.run_number }}
          name: Android keyboard 0.1.${{ github.run_number }}
          body: "Inline Autocorrect keyboard for Android 10+ (GrapheneOS). Install the APK, enable the keyboard under Settings → System → Keyboard, then pick it."
          files: android/inline-autocorrect.apk
