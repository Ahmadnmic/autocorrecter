<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><link rel="stylesheet" href="shared.css">
<style>
html,body{background:transparent;overflow:hidden}
#chips{position:absolute;right:0;bottom:0;display:flex;flex-direction:column;align-items:flex-end;gap:6px;padding:8px}
.chip{display:inline-flex;align-items:center;gap:8px;background:rgba(32,33,36,.94);color:#fff;border-radius:10px;padding:8px 12px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.35);animation:in .18s ease-out;max-width:340px}
.chip.out{animation:out .35s ease-in forwards}
.chip .diff s{color:#f28b82}.chip .diff b{color:#81c995}.chip .diff .arrow{color:#bdc1c6}
.chip .hl{border-radius:3px;padding:0 3px}
.hl.typo{background:rgba(158,158,158,.45)}.hl.recheck{background:rgba(251,188,4,.55)}.hl.context,.hl.resolved{background:rgba(26,115,232,.5)}.hl.translate{background:rgba(142,36,170,.5)}.hl.grammar{background:rgba(255,112,67,.5)}.hl.complete{background:rgba(24,128,56,.5)}.hl.revert{background:rgba(179,38,30,.5)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:translateY(6px)}}
</style></head><body><div id="chips"></div>
<script src="overlay.js"></script></body></html>
